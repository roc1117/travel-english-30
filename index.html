<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>여행영어 30일</title>
<meta name="description" content="공항부터 작별 인사까지 30일 180문장 여행영어. 차에서 듣는 드라이브 모드 포함.">
<meta name="theme-color" content="#F1F3F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A0F1A" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="여행영어">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: one phone-width column — a boarding-pass card for the day, a departure-board course list, a fixed bottom tab bar; drive mode is a full-screen night-dark overlay */
:root{
  --bg:#F1F3F7;
  --surface:#FFFFFF;
  --surface-2:#E6EAF1;
  --fg:#0F1A2B;
  --muted:#566275;
  --line:#D0D7E1;
  --accent:#F2B70D;
  --on-accent:#0F1A2B;
  --accent-text:#8A6200;
  --mark:rgba(242,183,13,.42);
  --ok:#1C7A52;
  --ok-bg:rgba(28,122,82,.11);
  --warn-bg:rgba(242,183,13,.18);
  --shadow:0 1px 2px rgba(15,26,43,.05),0 6px 20px rgba(15,26,43,.06);
  --car-bg:#05080F;
  --car-fg:#F3F5F9;
  --car-muted:#8B96A9;
  --car-line:#1F2939;
  --car-btn:#0F1624;
  --car-accent:#F5C21B;
  --display:"Do Hyeon","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:14px;
  --tabh:62px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A0F1A; --surface:#121A29; --surface-2:#1A2335; --fg:#E6EBF3; --muted:#97A3B6; --line:#243049;
    --accent:#F5C21B; --on-accent:#0A0F1A; --accent-text:#F5C93A; --mark:rgba(245,194,27,.28);
    --ok:#4CC38A; --ok-bg:rgba(76,195,138,.14); --warn-bg:rgba(245,194,27,.12); --shadow:none;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A0F1A; --surface:#121A29; --surface-2:#1A2335; --fg:#E6EBF3; --muted:#97A3B6; --line:#243049;
  --accent:#F5C21B; --on-accent:#0A0F1A; --accent-text:#F5C93A; --mark:rgba(245,194,27,.28);
  --ok:#4CC38A; --ok-bg:rgba(76,195,138,.14); --warn-bg:rgba(245,194,27,.12); --shadow:none;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.topline{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.install{flex:none;margin-top:-4px}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
html.car-open,html.car-open body{overflow:hidden}
p{margin:0}
h1,h2,h3{margin:0;text-wrap:balance}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px}

.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:calc(env(safe-area-inset-top,0px) + 22px) calc(var(--tabh) + 40px + env(safe-area-inset-bottom,0px))}
.eyebrow,.lbl{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-weight:400;font-size:34px;line-height:1.15;margin-top:4px}
h2{font-size:18px;font-weight:600;line-height:1.3}
.lede{margin-top:8px;color:var(--muted);font-size:15px;max-width:34em}

/* today header */
.stats{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:10px;font-size:14px;color:var(--muted)}
.stats b{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
.track{display:grid;grid-template-columns:repeat(30,1fr);gap:3px;margin-top:12px}
.track i{height:6px;border-radius:2px;background:var(--surface-2)}
.track i.done{background:var(--fg)}
.track i.cur{background:var(--accent)}

/* boarding pass */
.pass{margin-top:22px;display:grid;grid-template-columns:minmax(0,1fr) 88px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.pass-main{padding:18px;min-width:0}
.pass-head{display:flex;align-items:flex-end;gap:12px}
.dnum{font-family:var(--mono);font-size:50px;line-height:.9;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.zone{font-size:13px;font-weight:500;background:var(--surface-2);border-radius:6px;padding:2px 8px;margin-bottom:4px}
.pass-title{font-family:var(--display);font-weight:400;font-size:27px;line-height:1.2;margin-top:14px}
.pass-sub{color:var(--muted);font-size:14px;margin-top:2px}
.pass-actions{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap}
.pass-stub{position:relative;border-left:2px dashed var(--line);padding:18px 10px 18px 12px;display:flex;flex-direction:column;gap:2px}
.pass-stub::before,.pass-stub::after{content:"";position:absolute;left:-10px;width:18px;height:18px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.pass-stub::before{top:-10px}
.pass-stub::after{bottom:-10px}
.gate{font-family:var(--mono);font-size:22px;font-weight:500;letter-spacing:.04em;margin-bottom:12px}
.st{font-size:13px;font-weight:600}
.st.ok{color:var(--ok)}
.daynav{display:flex;justify-content:space-between;gap:8px;margin-top:10px}
.daynav .btn{font-family:var(--mono);font-size:13px}

/* buttons */
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-size:15px;font-weight:500;padding:9px 14px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;min-height:44px;line-height:1.2}
.btn svg{flex:none}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent;font-weight:600}
.btn.ghost{background:transparent}
.btn.sm{font-size:14px;padding:6px 12px;min-height:36px}
.btn.wide{width:100%}
.btn.big{min-height:56px;font-size:17px}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.playing{background:var(--surface-2);border-color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap}

/* sentence list */
.listbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:30px}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);cursor:pointer}
.sw{appearance:none;-webkit-appearance:none;margin:0;width:44px;height:26px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);position:relative;cursor:pointer;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.sw:checked{background:var(--fg);border-color:var(--fg)}
.sw:checked::after{transform:translateX(18px)}
.sents{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.sent{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 14px 16px;min-width:0}
.sent.them{background:transparent;border-style:dashed}
.sent-top{display:flex;align-items:center;gap:8px;min-height:36px}
.sid{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.role{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--surface-2)}
.them .role{background:transparent;border:1px solid var(--line);color:var(--accent-text)}
.star{margin-left:auto;width:40px;height:40px;margin-right:-8px;display:grid;place-items:center;border:0;background:transparent;color:var(--muted);border-radius:10px;cursor:pointer}
.star.on{color:var(--accent-text)}
.star.on path{fill:currentColor}
.ko{margin-top:4px;font-size:15px;color:var(--muted)}
.en{margin-top:2px;font-size:19px;line-height:1.42;font-weight:500;overflow-wrap:anywhere}
mark{background:linear-gradient(transparent 56%,var(--mark) 56%);color:inherit;padding:0 1px}
.tip{margin-top:8px;font-size:13px;color:var(--muted)}
.tip .lbl{margin-right:8px;font-size:10px}
.reveal{margin-top:6px;width:100%;text-align:left;border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:10px;padding:10px 12px;font-size:15px;cursor:pointer}
.sent-act{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.sent-act .dayref{margin-left:auto}
.finish{margin-top:22px}
.finish.done{background:var(--ok-bg);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.finish.done p{color:var(--ok);font-weight:600}

/* course board */
.searchbox{margin-top:18px}
.searchbox input{width:100%;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:0 14px;font:inherit;font-size:16px}
.searchbox input::placeholder{color:var(--muted)}
.phase{margin-top:26px}
.phase-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.board{list-style:none;padding:0;margin:8px 0 0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.brow{width:100%;display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 14px;background:transparent;border:0;border-top:1px solid var(--line);text-align:left;cursor:pointer}
.board li:first-child .brow{border-top:0}
.bday{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bt b{display:block;font-weight:600;font-size:15px;line-height:1.35}
.bt small{color:var(--muted);font-size:13px}
.chip{font-size:12px;padding:3px 8px;border-radius:6px;font-weight:600;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.next{background:var(--accent);color:var(--on-accent)}
.chip.plan{color:var(--muted);border:1px solid var(--line);font-weight:500}
.count{margin-top:16px;font-size:13px;color:var(--muted)}
.empty-line{margin-top:18px;color:var(--muted);font-size:15px}

/* drive setup */
.group{margin-top:22px}
.glabel{margin-bottom:8px;font-size:13px;font-weight:600;color:var(--muted)}
.ranges{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.range{text-align:left;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;min-width:0}
.range b{display:block;font-size:15px;font-weight:600}
.range small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.range[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.range:disabled{opacity:.42;cursor:not-allowed}
.seg{display:flex;background:var(--surface-2);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:8px 4px;border-radius:8px;font-size:14px;color:var(--muted);cursor:pointer;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:var(--shadow)}
.toggles{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.tg{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);font-size:15px;cursor:pointer}
.tg:first-child{border-top:0}
.start{margin-top:26px}
.notes{margin-top:18px;padding:14px 16px 14px 34px;border-radius:12px;background:var(--surface-2);font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.warn{margin-top:16px;background:var(--warn-bg);padding:12px 14px;border-radius:12px;font-size:14px}

/* review */
.empty{margin-top:20px;border:1px dashed var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.empty-t{font-weight:600}
.empty p:not(.empty-t){color:var(--muted);font-size:14px;margin-bottom:8px}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabbar button{position:relative;height:var(--tabh);background:transparent;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;cursor:pointer}
.tabbar button.on{color:var(--fg);font-weight:600}
.tabbar button.on::before{content:"";position:absolute;top:0;left:50%;width:28px;height:3px;margin-left:-14px;border-radius:0 0 3px 3px;background:var(--accent)}
.tabbar svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + 16px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.2)}

/* drive overlay — always night-dark, on purpose */
.car{position:fixed;inset:0;z-index:50;background:var(--car-bg);color:var(--car-fg);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 14px) 18px calc(env(safe-area-inset-bottom,0px) + 16px);color-scheme:dark}
.car-in{width:100%;max-width:720px;margin:0 auto;flex:1;display:flex;flex-direction:column;min-height:0}
.car-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.car .lbl{color:var(--car-muted)}
.car-label{font-size:15px;font-weight:500;margin-top:2px}
.car-close{background:transparent;color:var(--car-fg);border:1px solid var(--car-line);border-radius:10px;padding:8px 16px;min-height:44px;cursor:pointer;flex:none}
.car-mid{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;min-height:0;overflow-y:auto;padding-block:16px}
.car-meta{font-family:var(--mono);font-size:13px;color:var(--car-muted);letter-spacing:.04em}
.car-ko{font-size:clamp(22px,6vw,32px);line-height:1.4;font-weight:500}
.car-en{font-size:clamp(26px,7.4vw,42px);line-height:1.25;font-weight:600;color:var(--car-accent);letter-spacing:-.01em;overflow-wrap:anywhere}
.car-en mark{background:none;color:inherit;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:6px}
.veil{opacity:.3}
.car-stage{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.stage-l{font-size:17px;min-height:1.5em}
.bar{height:6px;background:var(--car-line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--car-accent)}
.car-count{font-family:var(--mono);font-size:14px;color:var(--car-muted);margin-bottom:10px;font-variant-numeric:tabular-nums}
.car-ctl{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:10px}
.car-ctl button{min-height:78px;border-radius:16px;border:1px solid var(--car-line);background:var(--car-btn);color:var(--car-fg);display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;cursor:pointer}
.car-ctl button svg{width:26px;height:26px}
.car-ctl .play{background:var(--car-accent);color:var(--car-bg);border-color:transparent;font-weight:600;font-size:16px}
.car-foot{font-size:13px;color:var(--car-muted);margin-top:12px;text-align:center}

@media (max-width:380px){
  h1{font-size:30px}
  .dnum{font-size:44px}
  .pass{grid-template-columns:minmax(0,1fr) 78px}
  .ranges{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important}
}
</style>
</head>
<body>

<div class="app"><main id="view"></main></div>

<nav class="tabbar" aria-label="메뉴">
  <div class="tabbar-in">
    <button data-tab="today"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg><span>오늘</span></button>
    <button data-tab="drive"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="2.2"/><path d="M3.8 10.5h6.1M14.1 10.5h6.1M12 14.2v6.1"/></svg><span>드라이브</span></button>
    <button data-tab="course"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg><span>과정</span></button>
    <button data-tab="saved"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 4h11v16l-5.5-3.8L6.5 20z"/></svg><span>복습</span></button>
  </div>
</nav>

<div id="toast" class="toast" role="status" hidden></div>

<div id="car" class="car" hidden role="dialog" aria-modal="true" aria-label="드라이브 모드">
  <div class="car-in">
    <div class="car-top">
      <div><p class="lbl">Drive mode</p><p id="carLabel" class="car-label"></p></div>
      <button class="car-close" data-car="close">닫기</button>
    </div>
    <div class="car-mid">
      <p class="car-meta"><span id="carDay"></span> · <span id="carRole"></span></p>
      <p id="carKo" class="car-ko"></p>
      <p id="carEn" class="car-en" lang="en"></p>
      <div class="car-stage"><p id="carStage" class="stage-l">&nbsp;</p><div class="bar"><i id="carBar"></i></div></div>
    </div>
    <p id="carCount" class="car-count"></p>
    <div class="car-ctl">
      <button data-car="prev" aria-label="이전 문장"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2.2v14H6zM19 5v14L9.2 12z" fill="currentColor"/></svg><span>이전</span></button>
      <button data-car="toggle" id="carPlay" class="play" aria-label="재생"></button>
      <button data-car="next" aria-label="다음 문장"><span>다음</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.8 5H18v14h-2.2zM5 5v14l9.8-7z" fill="currentColor"/></svg></button>
    </div>
    <p id="carWake" class="car-foot"></p>
  </div>
</div>

<script>
(function(){
'use strict';

/* ───────── 30일 과정 데이터 ───────── */
const PH={AIR:"공항·비행",HTL:"숙소",MOVE:"이동",FOOD:"식사",TOUR:"쇼핑·관광",HELP:"위급 상황",TALK:"대화"};
const PH_ORDER=["AIR","HTL","MOVE","FOOD","TOUR","HELP","TALK"];
/* 문장: [역할 m=내가 말하기 / t=듣게 될 말, 영어([ ]=핵심 패턴), 한국어, 팁] */
const D=[
{t:"공항 체크인",e:"Airport check-in",c:"CHK",p:"AIR",s:[
["m","I'd like to [check in for] my flight to London.","런던행 비행기 체크인하려고 합니다.","check in for + 항공편: ~편 체크인하다"],
["t","May I see your passport, please?","여권 좀 보여 주시겠어요?",""],
["m","[Could I get] an aisle seat?","통로 쪽 좌석으로 받을 수 있을까요?","창가석은 window seat"],
["t","How many bags are you checking in?","부치실 짐이 몇 개인가요?","check in a bag: 짐을 부치다"],

function norm(o){
  o=(o&&typeof o==="object")?o:{};
  const done={};
  if(o.done&&typeof o.done==="object"){for(const k in o.done){const n=+k;if(n>=1&&n<=30&&typeof o.done[k]==="string")done[n]=o.done[k];}}
  const favs=Array.isArray(o.favs)?o.favs.filter(x=>typeof x==="string"&&BY[x]):[];
  const set=Object.assign({},DEF_SET,(o.set&&typeof o.set==="object")?o.set:{});
  return {done:done,favs:favs,set:set,at:+o.at||0};
}

/* ───────── 음성 읽기 ───────── */
const TTS={ok:("speechSynthesis" in window)&&typeof window.SpeechSynthesisUtterance!=="undefined",en:null,ko:null};
function pickVoices(){
  if(!TTS.ok)return;
  let vs=[];try{vs=speechSynthesis.getVoices()||[];}catch(e){}
  if(!vs.length)return;
  const en=vs.filter(v=>/^en([-_]|$)/i.test(v.lang));
  const pref=["Samantha","Google US English","Microsoft Aria","Microsoft Jenny","Alex","Karen","Daniel"];
  TTS.en=pref.map(n=>en.find(v=>v.name.indexOf(n)===0)).find(Boolean)||en.find(v=>/en[-_]US/i.test(v.lang))||en[0]||null;
  const ko=vs.filter(v=>/^ko/i.test(v.lang));
  TTS.ko=ko.find(v=>/Yuna|Google/i.test(v.name))||ko[0]||null;
}
if(TTS.ok){pickVoices();try{speechSynthesis.addEventListener("voiceschanged",pickVoices);}catch(e){speechSynthesis.onvoiceschanged=pickVoices;}}
function stopSpeech(){if(!TTS.ok)return;try{if(speechSynthesis.speaking||speechSynthesis.pending)speechSynthesis.cancel();}catch(e){}}
function speak(text,lang,rate){
  return new Promise(res=>{
    if(!TTS.ok){res();return;}
    const u=new SpeechSynthesisUtterance(text);
    u.lang=lang==="ko"?"ko-KR":"en-US";
    const v=lang==="ko"?TTS.ko:TTS.en; if(v)u.voice=v;
    u.rate=rate||1; u.pitch=1;
    let fin=false;
    const done=()=>{if(fin)return;fin=true;clearTimeout(t);res();};
    const t=setTimeout(done,2500+text.length*(lang==="ko"?260:110)/(rate||1));
    u.onend=done; u.onerror=done;
    speak.keep=u;
    try{speechSynthesis.resume();speechSynthesis.speak(u);}catch(e){done();}
  });
}
function sayOne(btn,id,rate){
  const s=BY[id]; if(!s)return;
  if(!TTS.ok){toast("이 기기에서는 음성 읽기를 지원하지 않아요.");return;}
  document.querySelectorAll(".btn.playing").forEach(b=>b.classList.remove("playing"));
  stopSpeech();
  btn.classList.add("playing");
  speak(plain(s.en),"en",rate).then(()=>btn.classList.remove("playing"));
}

const P={list:[],i:0,playing:false,token:0,label:"",wake:null,show:{ko:true,en:true}};
const GAP={short:.75,normal:1,long:1.45};

}
async function playSentence(s,tok){
  const r=+S.set.rate||1, en=plain(s.en), mul=GAP[S.set.gap]||1;
  const words=en.split(/\s+/).length;
  const rep=Math.round((1000+words*450)*mul);
  const steps=[];
  if(S.set.order==="en"){
    P.show={ko:true,en:false};
    steps.push(["en",r,"영어 듣기"],["wait",rep,"따라 말해 보세요"]);
    if(S.set.slow)steps.push(["en",r*.8,"천천히 한 번 더"],["wait",Math.round(rep*.7),"따라 말해 보세요"]);
  }else if(s.role==="t"){
    P.show={ko:false,en:false};
    steps.push(["en",r,"현지에서 듣게 될 말"],["wait",Math.round(1600*mul),"무슨 뜻일까요?"],["ko",1,"한국어 뜻"],["wait",500,""],["en",S.set.slow?r*.85:r,"다시 듣기"]);
  }else{
    P.show={ko:false,en:false};
    steps.push(["ko",1,"한국어 뜻"],["wait",Math.round(1500*mul),"영어로 떠올려 보세요"],["en",r,"영어 듣기"],["wait",rep,"따라 말해 보세요"]);
    if(S.set.slow)steps.push(["en",r*.8,"천천히 한 번 더"],["wait",Math.round(rep*.7),"따라 말해 보세요"]);
  }
  steps.push(["wait",800,""]);
  for(const st of steps){
    if(tok!==P.token)return;
    if(st[0]==="wait"){if(st[2])setStage(st[2],st[1]);await sleep(st[1]);}
    else{
      P.show[st[0]]=true; drawCar(); setStage(st[2],0);
      await speak(st[0]==="ko"?s.ko:en,st[0],st[1]);
    }
  }
}
async function runFrom(i){
  const tok=++P.token;
  stopSpeech();
  P.i=i; P.playing=true;
  while(tok===P.token){
    if(P.i>=P.list.length){
      if(S.set.loop){P.i=0;if(S.set.shuffle)shuffle(P.list);}
      else{P.playing=false;drawCar();return;}
    }
    await playSentence(P.list[P.i],tok);
    if(tok!==P.token)return;
    P.i++;
  }
}
function carPause(){P.playing=false;P.token++;stopSpeech();drawCar();}
function carToggle(){if(P.playing)carPause();else runFrom(P.i>=P.list.length?0:P.i);}
function carStep(d){
  const cur=Math.min(P.i,P.list.length-1);
  const i=Math.max(0,Math.min(P.list.length-1,cur+d));
  if(P.playing)runFrom(i);else{P.i=i;drawCar();}
}
async function wakeOn(){
  const w=$("#carWake");
  if(!("wakeLock" in navigator)){w.textContent="화면이 꺼지면 재생이 멈춰요. 학습 중에는 화면을 켜 두세요.";return;}
  try{
    P.wake=await navigator.wakeLock.request("screen");
    w.textContent="재생 중에는 화면이 꺼지지 않도록 유지합니다.";
    P.wake.addEventListener("release",()=>{P.wake=null;});
  }catch(e){P.wake=null;w.textContent="화면이 꺼지면 재생이 멈춰요. 학습 중에는 화면을 켜 두세요.";}
}
function wakeOff(){try{if(P.wake)P.wake.release();}catch(e){}P.wake=null;}

  return '<header class="top"><p class="eyebrow">Drive mode</p><h1>차에서 듣기</h1>'+
    '<p class="lede">화면을 보지 않아도 되도록 한국어 뜻을 먼저 읽고, 영어로 떠올릴 시간을 준 뒤 영어 문장을 들려줍니다. 문장마다 따라 말할 시간도 둡니다.</p></header>'+
    (TTS.ok?'':'<p class="warn">이 브라우저는 음성 읽기를 지원하지 않습니다. Chrome이나 삼성 인터넷 최신 버전에서 열어 주세요.</p>')+
    '<div class="group"><p class="glabel">무엇을 들을까요</p><div class="ranges">'+
      R.map(x=>'<button class="range" data-range="'+x[0]+'" aria-pressed="'+(x[0]===range)+'"'+(c[x[0]]?"":" disabled")+'><b>'+esc(x[1])+'</b><small>'+esc(x[2])+' · '+c[x[0]]+'문장</small></button>').join("")+
    '</div></div>'+
    seg("order","듣는 순서",[["ko","한국어 뜻 → 영어"],["en","영어만"]])+
    seg("rate","영어 속도",[["0.85","천천히"],["1","보통"],["1.1","조금 빠르게"]])+
    seg("gap","따라 말할 시간",[["short","짧게"],["normal","보통"],["long","넉넉히"]])+
    '<div class="group"><div class="toggles">'+tg("slow","영어를 천천히 한 번 더 듣기")+tg("shuffle","순서 섞기")+tg("loop","끝나면 처음부터 다시 듣기")+'</div></div>'+
    '<div class="start"><button class="btn primary wide big" data-act="start-drive" data-range="'+range+'">'+ICON.play+'드라이브 모드 시작</button></div>'+
    '<ul class="notes"><li>출발 전에 재생을 시작하고, 운전 중에는 화면을 조작하지 마세요.</li>'+
    '<li>휴대폰을 차량 블루투스에 연결하면 차 스피커로 들을 수 있어요.</li>'+
    '<li>재생 중에는 화면이 꺼지지 않게 유지합니다. 다른 앱으로 전환하거나 화면을 끄면 재생이 멈출 수 있어요.</li></ul>';
}

function rCourse(){
  const fo=firstOpen(), doneN=Object.keys(S.done).length;
  let board="";
  PH_ORDER.forEach(p=>{
    const idx=[]; D.forEach((d,i)=>{if(d.p===p)idx.push(i+1);});
    board+='<section class="phase"><div class="phase-h"><h2>'+PH[p]+'</h2><span class="lbl">Day '+pad(idx[0])+'–'+pad(idx[idx.length-1])+'</span></div><ul class="board">'+
      idx.map(n=>{
        const d=D[n-1];
        const chip=S.done[n]?'<span class="chip ok">완료</span>':(n===fo?'<span class="chip next">다음</span>':'<span class="chip plan">예정</span>');
        return '<li><button class="brow" data-go="'+n+'"><span class="bday">DAY '+pad(n)+'</span><span class="bt"><b>'+esc(d.t)+'</b><small lang="en">'+esc(d.e)+'</small></span>'+chip+'</button></li>';
      }).join("")+'</ul></section>';
  });
  return '<header class="top"><p class="eyebrow">Course · 30 days · '+ALL.length+' sentences</p><h1>전체 과정</h1>'+
    '<p class="lede">공항 체크인부터 작별 인사까지 여행 순서대로, 하루 한 상황씩 익힙니다. 지금 '+doneN+'일째까지 마쳤어요.</p></header>'+
    '<div class="searchbox"><input id="q" type="search" placeholder="문장 찾기 (예: 환불, check in)" autocomplete="off" aria-label="문장 검색"></div>'+
    '<div id="results" hidden></div><div id="board">'+board+'</div>';
}
function drawResults(){
  const r=$("#results"), b=$("#board"); if(!r||!b)return;
  const q=query.trim().toLowerCase();
  if(!q){r.hidden=true;b.hidden=false;r.innerHTML="";return;}
  const hits=ALL.filter(s=>s.ko.toLowerCase().indexOf(q)>=0||plain(s.en).toLowerCase().indexOf(q)>=0||s.tip.toLowerCase().indexOf(q)>=0||D[s.day-1].t.indexOf(q)>=0);
  const shown=hits.slice(0,40);
  r.hidden=false; b.hidden=true;
  r.innerHTML=shown.length?'<p class="count">'+hits.length+'개 문장'+(hits.length>40?' 중 40개 표시':'')+'</p><ol class="sents">'+shown.map(s=>card(s,{showDay:true,noHide:true})).join("")+'</ol>'
    :'<p class="empty-line">\''+esc(query.trim())+'\'와 맞는 문장이 없어요. 다른 단어로 찾아보세요.</p>';
}

function rSaved(){
  const favs=S.favs.map(id=>BY[id]).filter(Boolean), doneN=Object.keys(S.done).length;
  return '<header class="top"><p class="eyebrow">Review</p><h1>복습 노트</h1>'+
    '<p class="lede">외우기 어려운 문장은 별을 눌러 모아 두고, 차에서 반복해서 들어 보세요.</p></header>'+
    '<div class="row" style="margin-top:18px"><button class="btn primary" data-act="drive-favs"'+(favs.length?"":" disabled")+'>'+ICON.play+'즐겨찾기 '+favs.length+'문장 듣기</button>'+
    '<button class="btn" data-act="drive-done"'+(doneN?"":" disabled")+'>완료한 '+doneN+'일 복습</button></div>'+
    (favs.length?'<ol class="sents" style="margin-top:18px">'+favs.map(s=>card(s,{showDay:true,noHide:true})).join("")+'</ol>'
      :'<div class="empty"><p class="empty-t">아직 저장한 문장이 없어요</p><p>문장 카드 오른쪽 위의 별을 누르면 여기에 모입니다. DAY '+pad(sel)+' '+esc(D[sel-1].t)+'에서 어려운 문장을 골라 보세요.</p><button class="btn" data-go="'+sel+'">DAY '+pad(sel)+' 문장 보기</button></div>');
}

const view=$("#view");
function render(){
  if(tab==="today")view.innerHTML=rToday();
  else if(tab==="drive")view.innerHTML=rDrive();
  else if(tab==="course"){view.innerHTML=rCourse();const q=$("#q");if(q)q.value=query;drawResults();}
  else view.innerHTML=rSaved();
  document.querySelectorAll(".tabbar button").forEach(b=>{const on=b.dataset.tab===tab;b.classList.toggle("on",on);if(on)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current");});
}
function setTab(t){tab=t;render();window.scrollTo(0,0);}

function toggleFav(id){
  const i=S.favs.indexOf(id);
  if(i>=0)S.favs.splice(i,1);else S.favs.push(id);
  commit();
  const on=i<0;
  if(tab==="saved"){render();}
  else document.querySelectorAll('[data-fav="'+id+'"]').forEach(b=>{b.classList.toggle("on",on);b.setAttribute("aria-pressed",String(on));});
  toast(on?"즐겨찾기에 담았어요.":"즐겨찾기에서 뺐어요.");
}

/* ───────── 이벤트 ───────── */
document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b||b.disabled)return;
  const ds=b.dataset;
  if(ds.car){
    if(ds.car==="close")closeCar();
    else if(ds.car==="toggle")carToggle();
    else if(ds.car==="prev")carStep(-1);
    else if(ds.car==="next")carStep(1);
    return;
  }
  if(ds.tab){setTab(ds.tab);return;}
  if(ds.fav){toggleFav(ds.fav);return;}
  if(ds.say){sayOne(b,ds.say,+ds.rate||1);return;}
  if(ds.reveal){revealed.add(ds.reveal);render();return;}
  if(ds.go){const n=+ds.go;if(n>=1&&n<=30){sel=n;selTouched=true;setTab("today");}return;}
  if(ds.set){let v=ds.val;if(ds.set==="rate")v=+v;S.set[ds.set]=v;commit();render();return;}
  if(ds.act==="start-drive"){openCar(ds.range||"today");return;}
  if(ds.range&&!ds.act){S.set.range=ds.range;commit();render();return;}
  switch(ds.act){
    case "install":
      if(installEvt){const ev=installEvt;installEvt=null;ev.prompt();ev.userChoice.finally(()=>render());}
      break;
    case "drive-today":openCar("today");break;
    case "drive-favs":openCar("favs");break;
    case "drive-done":openCar("done");break;
    case "complete":
      S.done[sel]=ymd(new Date());commit();render();
      toast("DAY "+pad(sel)+" 완료 · 연속 "+streak()+"일째");
      break;
    case "undo":
      delete S.done[sel];commit();render();
      break;
  }
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="hideEn"){S.set.hide=t.checked;revealed.clear();commit();render();return;}
  if(t.dataset&&t.dataset.tg){S.set[t.dataset.tg]=t.checked;commit();}
});
document.addEventListener("input",e=>{if(e.target.id==="q"){query=e.target.value;drawResults();}});
document.addEventListener("keydown",e=>{
  if(!carOpen)return;
  if(e.key==="Escape")closeCar();
  else if(e.key==="ArrowLeft")carStep(-1);
  else if(e.key==="ArrowRight")carStep(1);
  else if(e.key===" "&&!(e.target.closest&&e.target.closest("button"))){e.preventDefault();carToggle();}
});

const h=(location.hash||"").slice(1);
if(["today","drive","course","saved"].indexOf(h)>=0)tab=h;
render();
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{});});}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
})();
</script>
</body>
</html>
